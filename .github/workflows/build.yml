# Testa a cada push/PR; compila o WowPilotSync.exe no Windows; numa tag vX.Y.Z publica o Release com o .exe e o addon.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa pillow
      - run: python tests/run_tests.py
      - run: python tests/test_live_decode.py

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar o WowPilotSync.exe (csc do .NET Framework 4, já no Windows)
        shell: cmd
        run: client\build.cmd
      - name: Empacotar o addon (pasta WowPilot)
        shell: pwsh
        run: |
          New-Item -ItemType Directory WowPilot | Out-Null
          Copy-Item WowPilot.toc, WowPilot.lua, WowPilotLive.lua WowPilot/
          Compress-Archive WowPilot WowPilot.zip
      - name: Versão da tag = .toc = cliente
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $toc = (Select-String '^## Version:\s*(\S+)' WowPilot.toc).Matches[0].Groups[1].Value
          if ("v$toc" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME, mas o .toc diz $toc" }
          $exe = (Select-String 'Version = "([^"]+)"' client/WowPilotSync/Sync.cs).Matches[0].Groups[1].Value
          $ps1 = (Select-String "ClientVersion = '([^']+)'" client/WowPilotSync.ps1).Matches[0].Groups[1].Value
          $asm = (Select-String 'AssemblyInformationalVersion\("([^"]+)"' client/WowPilotSync/AssemblyInfo.cs).Matches[0].Groups[1].Value
          if (($exe, $ps1, $asm) -ne $toc) { throw "versões diferentes: toc $toc, Sync.cs $exe, ps1 $ps1, AssemblyInfo $asm" }
      - uses: actions/upload-artifact@v4
        with:
          name: wowpilot
          path: |
            client/WowPilotSync.exe
            WowPilot.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wowpilot
      - name: Publicar o Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" client/WowPilotSync.exe WowPilot.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
